name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Docker Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: ./yolk
          file: ./yolk/Dockerfile.winehq
          push: true
          tags: ghcr.io/franzdinklage/farming-simulator-25-egg:latest
          build-args: |
            WINE_BRANCH=stable